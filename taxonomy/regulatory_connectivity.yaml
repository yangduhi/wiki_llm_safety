concepts_tier1:
  - {id: concept-occupant-protection, title: Occupant Protection, cluster: occupant-protection, status: active, definition: Protection of occupants during crash events through structural performance, restraint logic, and injury mitigation.}
  - {id: concept-frontal-impact-protection, title: Frontal Impact Protection, cluster: occupant-protection, status: active, definition: Protection requirements and test logic centered on frontal crash loading conditions.}
  - {id: concept-side-impact-protection, title: Side Impact Protection, cluster: occupant-protection, status: active, definition: Protection requirements and test logic centered on lateral crash loading conditions.}
  - {id: concept-restraint-systems, title: Restraint Systems, cluster: occupant-protection, status: active, definition: Belts, airbags, anchorage logic, and related occupant restraint performance structures.}
  - {id: concept-injury-criteria, title: Injury Criteria, cluster: occupant-protection, status: active, definition: Performance thresholds and evaluation signals used to judge occupant injury risk.}
  - {id: concept-child-restraint-systems, title: Child Restraint Systems, cluster: occupant-protection, status: active, definition: Child-seat and child-occupant restraint logic used for protection and suppression evaluation.}
  - {id: concept-door-retention, title: Door Retention, cluster: structural-retention-and-egress, status: active, definition: Retention of doors and door hardware to prevent unintended opening in crash conditions.}
  - {id: concept-anti-ejection, title: Anti-Ejection, cluster: structural-retention-and-egress, status: active, definition: Measures intended to reduce occupant ejection through doors, glazing, or openings in crash events.}
  - {id: concept-emergency-egress, title: Emergency Egress, cluster: structural-retention-and-egress, status: active, definition: Ability for occupants or responders to exit or access the vehicle after a crash event.}
  - {id: concept-glazing-materials, title: Glazing Materials, cluster: visibility-glazing, status: active, definition: Safety performance and functional role of glazing materials used in windscreens and windows.}
  - {id: concept-driver-visibility, title: Driver Visibility, cluster: visibility-glazing, status: active, definition: Driver field-of-view, defogging, wiping, and visibility-support functions tied to glazing systems.}
  - {id: concept-ev-electrical-safety, title: EV Electrical Safety, cluster: battery-fire-and-electrical-safety, status: active, definition: Electrical safety of vehicle powertrains and high-voltage systems in crash and post-crash conditions.}
  - {id: concept-electrical-shock-protection, title: Electrical Shock Protection, cluster: battery-fire-and-electrical-safety, status: active, definition: Measures preventing hazardous electrical exposure to occupants and responders.}
  - {id: concept-post-crash-isolation, title: Post-Crash Isolation, cluster: battery-fire-and-electrical-safety, status: active, definition: Isolation and shutdown behavior of energy systems following a collision event.}
  - {id: concept-type-approval-framework, title: Type Approval Framework, cluster: approval-and-governance, status: active, definition: Administrative framework governing approval, applicability, and legal placement of vehicle safety requirements.}
  - {id: concept-conformity-assessment, title: Conformity Assessment, cluster: approval-and-governance, status: active, definition: Assessment and certification logic used to confirm compliance with technical vehicle requirements.}

